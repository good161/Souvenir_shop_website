<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>ЧГУ | IT-сервисы</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="responsive.css">
</head>
<body>
    <div class="page-wrapper">
        <a href="../index.html" class="back-button">← На главную</a>
        <div class="brand-header">
            <div class="header-overlay">
                <p>IT-сервисы ЧГУ</p>
            </div>
        </div>

        <div class="services-grid" id="servicesGrid">
            Загрузка...
        </div>

        <div class="footer-note">
            <span>© 2026 ЧГУ | Единая платформа сервисов</span>
            <div class="badge-mini">доступно авторизованным пользователям</div>
        </div>
    </div>

    <button id="editServicesBtn" class="back-button" style="top:80px;display:none;position:fixed;left:20px;">✏️</button>

    <div id="servicesModal" class="channels-modal">
        <div class="channels-modal-content">
            <h3>Редактировать сервисы</h3>
            <div id="servicesEditList"></div>
            <div style="display:flex;gap:0.5rem;margin-top:1rem;flex-wrap:wrap;">
                <input type="text" id="newServiceName" placeholder="Название" class="channels-input" style="flex:1;">
                <input type="text" id="newServiceUrl" placeholder="URL" class="channels-input" style="flex:2;">
                <input type="text" id="newServiceDesc" placeholder="Описание" class="channels-input" style="flex:1;">
            </div>
            <div style="display:flex;gap:0.5rem;margin-top:0.5rem;">
                <button id="addServiceBtn" class="channels-btn primary">Добавить</button>
                <button id="closeServicesBtn" class="channels-btn">Закрыть</button>
            </div>
        </div>
    </div>

    <div id="toastMsg" class="toast-message"></div>

    <script src="it-services.js"></script>
</body>
</html>
