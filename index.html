<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" type="image/png" href="images/Design/favicon.png">
    <meta charset="UTF-8">
    <meta name="google-site-verification" content="R_8sgPcTCzbJSGuzMVT5Ft8fqcB6bZWigp1NoSuXoEs" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>ЧГУ | Панель сервисов</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

    <button id="adminBtn" class="admin-button" title="Админ-панель">⚙️</button>
    <button id="showAdminsBtn" class="scroll-button" style="top:80px;display:none;" title="Администраторы">👥</button>
    
    <div class="page-wrapper">
        <div class="brand-header">
            <div class="header-overlay">
                <p>Цифровые сервисы для сотрудников и студентов</p>
            </div>
        </div>

        <div class="services-grid" id="servicesGrid">
        </div>

        <div class="footer-note">
            <span>© 2026 ЧГУ | Единая платформа сервисов</span>
            <div class="badge-mini">доступно авторизованным пользователям</div>
        </div>
    </div>

    <button id="showAddCardModal" class="scroll-button" style="top:140px;display:none;" title="Добавить карточку">➕</button>

    <div id="editCardModal" class="channels-modal">
        <div class="channels-modal-content">
            <h3>Редактировать карточку</h3>
            <input type="hidden" id="editCardId">
            <textarea id="editCardName" placeholder="Название" class="channels-input" style="margin-top:0.5rem;resize:none;overflow:hidden;"></textarea>
            <textarea id="editCardDescription" placeholder="Описание" class="channels-input" style="margin-top:0.5rem;resize:none;overflow:hidden;"></textarea>
            
            <div id="channelsEditSection" style="display:none;margin-top:1rem;padding-top:1rem;border-top:2px solid #e2e8f0;">
                <h4 style="font-size:0.9rem;font-weight:600;margin-bottom:0.5rem;color:#1e293b;">Каналы</h4>
                <div id="channelsEditList"></div>
                <div class="channels-add-row" style="display:flex;gap:0.5rem;margin-top:0.5rem;flex-wrap:wrap;">
                    <input type="text" id="newChannelName" placeholder="Название" class="channels-input" style="flex:1;min-width:100px;margin-bottom:0;">
                    <input type="text" id="newChannelUrl" placeholder="URL" class="channels-input" style="flex:2;min-width:150px;margin-bottom:0;">
                </div>
                <div class="channels-buttons" style="display:flex;gap:0.5rem;margin-top:0.5rem;">
                    <button id="addChannelBtn" class="channels-btn primary">Добавить</button>
                </div>
            </div>
            
            <div class="channels-buttons">
                <button id="saveCardBtn" class="channels-btn primary">Сохранить</button>
                <button id="deleteCardBtn" class="channels-btn danger" style="display:none;">🗑️ Удалить</button>
                <button id="closeEditCardBtn" class="channels-btn">Закрыть</button>
            </div>
        </div>
    </div>

    <div id="addCardModal" class="channels-modal">
        <div class="channels-modal-content">
            <h3>Добавить карточку</h3>
            <input type="text" id="newCardName" placeholder="Название карточки" class="channels-input">
            <textarea id="newCardDescription" placeholder="Описание" class="channels-input" style="resize:none;overflow:hidden;"></textarea>
            <div class="channels-buttons">
                <button id="createCardBtn" class="channels-btn primary">Создать</button>
                <button id="closeAddCardBtn" class="channels-btn">Отмена</button>
            </div>
        </div>
    </div>

    <div id="loginModal" class="modal">
        <div class="modal-content">
            <h3>Вход в админ-панель</h3>
            <input type="text" id="loginInput" placeholder="Логин" class="modal-input">
            <input type="password" id="passwordInput" placeholder="Пароль" class="modal-input">
            <div class="modal-buttons">
                <button id="loginSubmit" class="modal-btn primary">Войти</button>
                <button id="loginCancel" class="modal-btn">Отмена</button>
            </div>
            <p id="loginError" class="error-msg"></p>
        </div>
    </div>

    <div id="adminsModal" class="modal">
        <div class="modal-content">
            <h3>Администраторы</h3>
            <div id="adminsList"></div>
            <div style="display:flex;gap:0.5rem;margin-top:1rem;flex-wrap:wrap;">
                <input type="text" id="newAdminFullName" placeholder="ФИО" class="modal-input" style="flex:1;min-width:150px;">
                <input type="text" id="newAdminUsername" placeholder="Логин" class="modal-input" style="flex:1;min-width:100px;">
                <input type="password" id="newAdminPassword" placeholder="Пароль" class="modal-input" style="flex:1;min-width:100px;">
                <select id="newAdminRole" class="modal-input" style="width:auto;">
                    <option value="manager">Менеджер</option>
                </select>
            </div>
            <div id="newAdminPermissions" style="margin-top:0.5rem;display:flex;gap:1rem;flex-wrap:wrap;">
                <label class="checkbox-label"><input type="checkbox" id="newPermMain" checked> Редактирование главной</label>
                <label class="checkbox-label"><input type="checkbox" id="newPermMerch" checked> Редактирование мерча</label>
            </div>
            <button id="addAdminBtn" class="modal-btn primary" style="margin-top:0.5rem;">Добавить</button>
            <button id="closeAdminsBtn" class="modal-btn" style="margin-top:0.5rem;">Закрыть</button>
        </div>
    </div>

    <div id="editAdminModal" class="modal">
        <div class="modal-content">
            <h3>Редактировать администратора</h3>
            <input type="hidden" id="editAdminId">
            <input type="text" id="editAdminFullName" placeholder="ФИО" class="modal-input">
            <input type="text" id="editAdminUsername" placeholder="Логин" class="modal-input">
            <select id="editAdminRole" class="modal-input">
                <option value="manager">Менеджер</option>
                <option value="Protoadmin">Protoadmin</option>
            </select>
            <input type="password" id="editAdminPassword" placeholder="Новый пароль (оставьте пустым, чтобы не менять)" class="modal-input">
            <div id="editAdminPermissions" style="margin-top:0.5rem;display:flex;gap:1rem;flex-wrap:wrap;">
                <label class="checkbox-label"><input type="checkbox" id="editPermMain"> Редактирование главной</label>
                <label class="checkbox-label"><input type="checkbox" id="editPermMerch"> Редактирование мерча</label>
            </div>
            <div class="modal-buttons">
                <button id="saveEditAdminBtn" class="modal-btn primary">Сохранить</button>
                <button id="closeEditAdminBtn" class="modal-btn">Отмена</button>
            </div>
        </div>
    </div>

    <div id="toastMsg" class="toast-message"></div>

    <script src="js/admin-managers.js"></script>
    <script src="js/admin-auth.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
