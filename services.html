<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>ЧГУ | Сервисы</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/services.css">
</head>
<body>
    <div class="page-wrapper">
        <a href="index.html" class="back-button">← На главную</a>
        <div class="brand-header">
            <div class="header-overlay">
                <p id="pageTitle">Сервисы</p>
            </div>
        </div>

        <div class="services-page">
            <div id="linksList">Загрузка...</div>
            <button id="editLinksBtn" class="edit-btn">✏️ Редактировать</button>
        </div>

        <footer class="footer-note">
            <span>© 2026 ЧГУ | Единая платформа сервисов</span>
            <div class="badge-mini">доступно авторизованным пользователям</div>
        </footer>
    </div>

    <div id="linksModal" class="channels-modal">
        <div class="channels-modal-content">
            <h3>Редактировать ссылки</h3>
            <div id="linksEditList"></div>
            <div style="display:flex;gap:0.5rem;margin-top:1rem;flex-wrap:wrap;">
                <input type="text" id="newLinkName" placeholder="Название" class="channels-input" style="flex:1;min-width:100px;">
                <input type="text" id="newLinkUrl" placeholder="URL" class="channels-input" style="flex:2;min-width:150px;">
                <input type="text" id="newLinkDesc" placeholder="Описание" class="channels-input" style="flex:1;min-width:100px;">
            </div>
            <div style="display:flex;gap:0.5rem;margin-top:0.5rem;">
                <button id="addLinkBtn" class="channels-btn primary">Добавить</button>
                <button id="closeLinksBtn" class="channels-btn">Закрыть</button>
            </div>
        </div>
    </div>

    <script src="js/services.js"></script>
</body>
</html>
